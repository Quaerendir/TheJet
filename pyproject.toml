[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thejet-atari"
version = "0.1.0"
description = "The Jet (Atari 8-bit, Dariusz Zolna 1992): the Tajemnice ATARI type-in shooter reconstructed from its 6502 code as a deterministic Python engine with a pygame front end"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Quaerendir" }]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["atari", "atari-8-bit", "6502", "the-jet", "tajemnice-atari", "retro", "pygame", "pokey", "game-preservation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Arcade",
    "Topic :: System :: Emulators",
    "Typing :: Typed",
]
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
test = ["pytest", "hypothesis", "mypy", "py65"]
disasm = ["py65"]

[project.urls]
Homepage = "https://github.com/Quaerendir/TheJet"
Source = "https://github.com/Quaerendir/TheJet"
Issues = "https://github.com/Quaerendir/TheJet/issues"

[project.scripts]
thejet = "thejet.play:main"

[tool.setuptools]
packages = ["thejet"]

[tool.setuptools.package-data]
thejet = ["data/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
